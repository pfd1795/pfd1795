<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
          font-family="Courier New, monospace" font-size="260" font-weight="bold"
          fill="#39ff14" stroke="#05d9e8" stroke-width="6">PD</text>
  </g>
  <!-- scanlines -->
  <g opacity="0.12">
    <rect x="0" y="0" width="512" height="512" fill="none"/>
  </g>
</svg>
