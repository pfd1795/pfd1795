<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030508">
<meta name="description" content="NEXUS DEVICE LAB — Universal Browser Diagnostics Platform. Diagnóstico universal de dispositivos 100% local.">
<title>NEXUS DEVICE LAB · Universal Browser Diagnostics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030508'/%3E%3Cpath d='M8 24V8h3l10 12V8h3v16h-3L11 12v12z' fill='%2300e5ff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   NEXUS DEVICE LAB — CSS EMBEBIDO · CYBERPUNK TERMINAL THEME
   ============================================================ */
:root{
  --bg:#030508; --bg2:#050a10; --panel:#0a1219; --panel2:#0d1822;
  --line:#0f2a3a; --line2:#1a4a63;
  --cyan:#00e5ff; --cyan-d:#0a7f8f; --mag:#ff2bd6; --green:#00ff9d;
  --amber:#ffb547; --red:#ff3355; --violet:#7c4dff;
  --tx:#c9e7f2; --dim:#587484; --dim2:#3a4f5c;
  --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--tx); font-family:var(--mono);
  font-size:14px; line-height:1.5; min-height:100vh;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,229,255,.025) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(0,229,255,.025) 0 1px, transparent 1px 44px);
}
::selection{background:var(--cyan);color:#02141a}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-d)}

/* ---------- FX: scanlines globales ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:98;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px);
  opacity:.45;mix-blend-mode:multiply}
#fx::after{content:"";position:absolute;left:0;right:0;top:-30%;height:26%;
  background:rgba(0,229,255,.035);animation:beam 9s linear infinite}
@keyframes beam{0%{top:-30%}100%{top:110%}}

/* ---------- HEADER ---------- */
#hd{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:10px 16px;background:rgba(3,5,8,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:220px}
.brand b{font-size:17px;letter-spacing:.35em;color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.55);font-weight:700}
.brand b .n{color:var(--mag);text-shadow:0 0 12px rgba(255,43,214,.55)}
.brand span{font-size:9px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.hd-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.hstat{display:flex;flex-direction:column;align-items:flex-end;font-size:9px;letter-spacing:.2em;color:var(--dim)}
.hstat b{font-size:13px;color:var(--tx);letter-spacing:.12em}
.lednet{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;vertical-align:middle}
.lednet.off{background:var(--red);box-shadow:0 0 8px var(--red)}
.lednet.uns{background:var(--amber);box-shadow:0 0 8px var(--amber)}

/* ---------- CONTROL BAR ---------- */
#ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;
  max-width:1240px;margin:0 auto;border-bottom:1px dashed var(--line)}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  background:transparent;color:var(--cyan);border:1px solid var(--cyan-d);
  padding:9px 14px;cursor:pointer;transition:all .18s ease;border-radius:2px}
.btn:hover{background:rgba(0,229,255,.10);border-color:var(--cyan);box-shadow:0 0 14px rgba(0,229,255,.25)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.btn.on{background:var(--cyan);color:#02141a;border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.5);font-weight:700}
.btn.mag{color:var(--mag);border-color:#7a1a68}
.btn.mag:hover{background:rgba(255,43,214,.10);border-color:var(--mag);box-shadow:0 0 14px rgba(255,43,214,.25)}
.btn.mag.on{background:var(--mag);color:#1a0214;border-color:var(--mag)}
.btn.grn{color:var(--green);border-color:#0a6b4a}
.btn.grn:hover{background:rgba(0,255,157,.10);border-color:var(--green);box-shadow:0 0 14px rgba(0,255,157,.25)}
.btn.gh{color:var(--dim);border-color:var(--line)}
.btn.gh:hover{color:var(--tx);background:rgba(200,230,245,.05);border-color:var(--dim)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.sep{flex:1}

/* ---------- SCORE PANEL ---------- */
#score{max-width:1240px;margin:16px auto 0;padding:0 16px}
.score-card{display:flex;gap:24px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);
  background:var(--panel);padding:16px 20px;border-radius:2px;position:relative}
.score-card::before,.score-card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.score-card::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.score-card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}
.sc-num{display:flex;align-items:baseline;gap:10px}
.sc-num b{font-size:52px;color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.5);font-variant-numeric:tabular-nums;line-height:1}
.sc-num small{color:var(--dim);font-size:14px}
.sc-lbl{font-size:12px;letter-spacing:.3em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--cyan-d);color:var(--cyan);border-radius:2px}
.sc-lbl.lim{color:var(--red);border-color:var(--red);text-shadow:0 0 8px rgba(255,51,85,.4)}
.sc-lbl.reg{color:var(--amber);border-color:var(--amber)}
.sc-lbl.bueno,.sc-lbl.mb{color:var(--cyan);border-color:var(--cyan)}
.sc-lbl.exc{color:var(--green);border-color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.4)}
.sc-bar{flex:1;min-width:220px}
.bar{height:7px;background:var(--bg2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.6);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar i.grn{background:var(--green);box-shadow:0 0 10px rgba(0,255,157,.6)}
.bar i.amb{background:var(--amber);box-shadow:0 0 10px rgba(255,181,71,.6)}
.bar i.red{background:var(--red);box-shadow:0 0 10px rgba(255,51,85,.6)}
#chips{display:flex;gap:10px;flex-wrap:wrap;flex:2 1 320px}
.chip{flex:1 1 96px;min-width:96px;border:1px solid var(--line);background:var(--panel2);padding:7px 9px;border-radius:2px}
.chip i{display:block;font-style:normal;font-size:8px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.chip b{font-size:13px;color:var(--tx);font-variant-numeric:tabular-nums}
.chip .bar{height:4px;margin-top:4px}

/* ---------- GRID + CARDS ---------- */
#grid{display:grid;grid-template-columns:1fr;gap:14px;max-width:1240px;margin:0 auto;padding:16px}
@media(min-width:940px){#grid{grid-template-columns:1fr 1fr}.card.wide{grid-column:1/-1}}
.card{border:1px solid var(--line);background:var(--panel);border-radius:2px;position:relative;
  display:flex;flex-direction:column;transition:border-color .2s ease, box-shadow .2s ease}
.card:hover{border-color:var(--line2)}
.card::before{content:"";position:absolute;top:-1px;left:-1px;width:12px;height:12px;
  border-top:2px solid var(--cyan-d);border-left:2px solid var(--cyan-d);transition:border-color .2s}
.card:hover::before{border-color:var(--cyan)}
.card-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.card-hd .glyph{font-size:10px;color:var(--mag);letter-spacing:.1em}
.card-hd h3{font-size:11px;letter-spacing:.24em;color:var(--tx);font-weight:700;text-transform:uppercase;flex:1}
.led{width:9px;height:9px;border-radius:50%;background:var(--dim2);box-shadow:none;flex:none;transition:all .25s}
.led-ok{background:var(--green);box-shadow:0 0 9px var(--green)}
.led-warn{background:var(--amber);box-shadow:0 0 9px var(--amber)}
.led-fail{background:var(--red);box-shadow:0 0 9px var(--red)}
.led-run{background:var(--cyan);box-shadow:0 0 9px var(--cyan);animation:blink .7s steps(2) infinite}
.led-pending{background:var(--dim2)}
@keyframes blink{50%{opacity:.25}}
.st{font-size:9px;letter-spacing:.18em;flex:none;color:var(--dim)}
.st-ok{color:var(--green)}.st-warn{color:var(--amber)}.st-fail{color:var(--red)}
.st-run{color:var(--cyan)}.st-pending{color:var(--dim)}
.card-bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.user-msg{font-size:13px;color:var(--tx)}
.user-msg b{color:var(--cyan)}
.tech-box{display:none;border-top:1px dashed var(--line);padding-top:10px}
body.tech-on .tech-box{display:block}
.kv{display:flex;justify-content:space-between;gap:14px;padding:4px 0;border-bottom:1px solid rgba(15,42,58,.5);font-size:11px}
.kv span{color:var(--dim);text-transform:uppercase;letter-spacing:.08em;flex:none}
.kv b{color:var(--tx);font-weight:400;text-align:right;word-break:break-word}
.kv-empty{font-size:11px;color:var(--dim)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.mini{padding:7px 10px;font-size:10px}
.live{display:flex;flex-direction:column;gap:10px}
.live-note{font-size:10px;color:var(--dim);letter-spacing:.08em}

/* ---------- PADS (touch / input) ---------- */
.pad{position:relative;height:170px;border:1px dashed var(--line2);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:11px;
  letter-spacing:.2em;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:2px;cursor:crosshair}
.pad:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.dot{position:absolute;width:26px;height:26px;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%);border:2px solid;opacity:.9;transition:opacity .2s}
.dot::after{content:"";position:absolute;inset:6px;border-radius:50%;background:currentColor;opacity:.5}
.pad-log{list-style:none;font-size:10px;color:var(--dim);max-height:96px;overflow:auto;
  border:1px solid var(--line);background:var(--bg2);padding:6px 8px;border-radius:2px}
.pad-log li{padding:1px 0;border-bottom:1px solid rgba(15,42,58,.4)}
.pad-log li b{color:var(--cyan);font-weight:400}
.pad-log li.mg b{color:var(--mag)}
.pad-log li.gr b{color:var(--green)}
.pad-live{font-size:11px;letter-spacing:.14em;color:var(--cyan)}

/* ---------- MEDIA (cámara / mic) ---------- */
video#camvid{width:100%;max-height:300px;background:#000;border:1px solid var(--line);border-radius:2px;display:none}
video#camvid.on{display:block}
img#camshot{width:100%;max-height:240px;object-fit:contain;border:1px solid var(--line2);display:none;background:#000}
canvas{display:block;width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:2px}
.geo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.geo-grid>div{border:1px solid var(--line);background:var(--panel2);padding:7px 9px;border-radius:2px}
.geo-grid i{display:block;font-style:normal;font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.geo-grid b{font-size:13px;color:var(--green);font-variant-numeric:tabular-nums;word-break:break-all}
.mv-flash{background:rgba(0,255,157,.16)!important;border-color:var(--green)!important}

/* ---------- BENCHMARKS ---------- */
.bench-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  border:1px solid var(--line);background:var(--panel2);padding:10px 12px;border-radius:2px}
.bench-row h4{font-size:11px;letter-spacing:.2em;color:var(--tx);text-transform:uppercase}
.bench-row p{font-size:10px;color:var(--dim)}
.bench-val{font-size:13px;color:var(--green);font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.bench-bar{grid-column:1/-1}

/* ---------- OVERLAYS ---------- */
#colortest{position:fixed;inset:0;z-index:200;display:none;cursor:pointer}
#colortest.on{display:block}
#colortest .ct-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.45);pointer-events:none}
#modal{position:fixed;inset:0;z-index:210;background:rgba(1,3,6,.88);backdrop-filter:blur(5px);
  display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
#modal.on{display:flex}
.modal-box{width:100%;max-width:920px;border:1px solid var(--line2);background:var(--panel);border-radius:2px}
.rpt-actions{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- REPORTE ---------- */
.rpt{padding:26px}
.rpt-hd{font-size:20px;letter-spacing:.3em;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.5);border-bottom:2px solid var(--cyan-d);padding-bottom:10px}
.rpt-hd span{display:block;font-size:9px;letter-spacing:.34em;color:var(--dim);margin-top:5px}
.rpt-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:10px;color:var(--dim);letter-spacing:.14em;padding:12px 0}
.rpt h4{font-size:11px;letter-spacing:.26em;color:var(--mag);margin:18px 0 8px;text-transform:uppercase}
.rpt table{width:100%;border-collapse:collapse;font-size:11px}
.rpt table th{text-align:left;color:var(--dim);letter-spacing:.14em;font-size:9px;text-transform:uppercase;border-bottom:1px solid var(--line2);padding:6px 8px}
.rpt table td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.rpt .cap-list{display:flex;flex-wrap:wrap;gap:6px}
.rpt .cap-list i{font-style:normal;font-size:10px;border:1px solid var(--green);color:var(--green);padding:2px 7px;letter-spacing:.06em}
.rpt .lim-list i{border-color:var(--amber);color:var(--amber)}
.rpt .score-line{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line2);background:var(--panel2);padding:12px 16px}
.rpt .score-line b{font-size:38px;color:var(--cyan);font-variant-numeric:tabular-nums}
.rpt .score-line em{font-style:normal;letter-spacing:.3em;font-size:12px;color:var(--green);text-transform:uppercase}
.rpt .rpt-firm{margin-top:20px;padding-top:10px;border-top:1px dashed var(--line);font-size:9px;letter-spacing:.2em;color:var(--dim)}

/* ---------- TOASTS ---------- */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
.toast{font-size:11px;letter-spacing:.1em;padding:10px 16px;border-radius:2px;background:var(--panel2);
  border:1px solid var(--cyan-d);color:var(--tx);box-shadow:0 0 18px rgba(0,0,0,.6);animation:tin .25s ease}
.toast.warn{border-color:var(--amber);color:var(--amber)}
.toast.fail{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green);color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- FOOTER ---------- */
#ft{max-width:1240px;margin:0 auto;padding:20px 16px 40px;color:var(--dim);font-size:9px;
  letter-spacing:.24em;text-align:center;border-top:1px solid var(--line)}
#ft b{color:var(--cyan-d)}

.hidden{display:none!important}

@media (max-width:600px){
  .brand b{font-size:14px;letter-spacing:.25em}
  .sc-num b{font-size:40px}
  .card-hd h3{font-size:10px;letter-spacing:.16em}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  @page{margin:12mm}
  body{background:#fff!important}
  #hd,#ctl,#score,#grid,#fx,#toasts,.no-print{display:none!important}
  #modal{display:block!important;position:static!important;background:#fff!important;padding:0!important;overflow:visible}
  #modal .modal-box{border:none;max-width:none;background:#fff!important}
  .rpt,.rpt *{color:#000!important;text-shadow:none!important}
  .rpt-hd{border-color:#000!important}
  .rpt table th,.rpt table td{border-bottom:1px solid #555!important;color:#000!important}
  .rpt .cap-list i{border-color:#555!important;color:#000!important}
  .rpt .score-line{border-color:#555!important;background:#fff!important}
}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<header id="hd">
  <div class="brand">
    <b>NEXUS<span class="n">·</span>DEVICE LAB</b>
    <span>Universal Browser Diagnostics Platform // v2.6.0</span>
  </div>
  <div class="hd-right">
    <div class="hstat"><b id="clock">--:--:--</b><span>RELOJ LOCAL</span></div>
    <div class="hstat"><b><i id="netled" class="lednet"></i></b><span id="netlbl">RED</span></div>
    <div class="hstat"><b id="secled" class="lednet uns"></b><span>CONTEXTO</span></div>
  </div>
</header>

<div id="ctl" role="toolbar" aria-label="Modos de análisis">
  <button class="btn" id="m-quick" data-mode="quick">Diagnóstico Rápido</button>
  <button class="btn" id="m-full" data-mode="full">Diagnóstico Completo</button>
  <button class="btn" id="m-manual" data-mode="manual">Diagnóstico Manual</button>
  <span class="sep"></span>
  <button class="btn mag" id="techbtn">Ver Detalles Técnicos</button>
  <button class="btn gh" id="resetbtn">Reiniciar</button>
</div>

<section id="score" aria-label="Device Health Score">
  <div class="score-card">
    <div class="sc-num"><b id="scv">0</b><small>/100</small><span class="sc-lbl" id="scl">ANALIZANDO…</span></div>
    <div class="sc-bar">
      <div class="bar"><i id="scbar"></i></div>
      <div class="live-note" style="margin-top:6px">DEVICE HEALTH SCORE · calculado localmente</div>
    </div>
    <div id="chips"></div>
  </div>
</section>

<main id="grid" aria-live="polite"></main>

<footer id="ft">
  NEXUS DEVICE LAB · 100% LOCAL — NINGÚN DATO SALE DE ESTE DISPOSITIVO · TECNOLOGÍAS WEB NATIVAS · SIN DEPENDENCIAS
</footer>

<div id="colortest" role="button" aria-label="Tocar para salir de la prueba de pantalla">
  <div class="ct-hint">TOCA PARA SALIR</div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-label="Informe final">
  <div class="modal-box">
    <div id="rpt" class="rpt"></div>
    <div class="rpt-actions no-print">
      <button class="btn grn" id="printbtn">Imprimir / Guardar PDF</button>
      <button class="btn gh" id="closemodal">Cerrar</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="assertive"></div>

<noscript><p style="padding:30px;text-align:center;color:#ff3355">NEXUS DEVICE LAB requiere JavaScript para ejecutar el diagnóstico.</p></noscript>

<script>
(() => {
'use strict';

/* ============================================================
   UTILIDADES
   ============================================================ */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[m]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const txt = (v, fb) => (v === 0 ? '0' : (v == null || v === '' ? (fb || '—') : String(v)));
const deg = v => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(1) + '°';
const fmtTime = s => {
  if (s == null || !isFinite(s)) return '—';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h ? h + ' h ' : '') + m + ' min';
};
function guard(fn) {
  return function () {
    try { const r = fn.apply(null, arguments); if (r && typeof r.catch === 'function') r.catch(swallow); }
    catch (e) { swallow(e); }
  };
}
function swallow(e) { if (console && console.warn) console.warn('NEXUS: operación no disponible →', e && e.message ? e.message : e); }

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const STATE = {
  mode: null, tech: false, started: false,
  results: new Map(),
  h: {},                 // handles: cam, mic, micctx, micraf, geo, gyro, accel
  perms: {},             // permisos consultados
  pip: null,             // beforeinstallprompt
  bench: {},             // resultados de benchmarks
  general: {},           // datos generales del dispositivo
  lastScore: { total: 0, label: '—' }
};
const ST = {
  pending: { g: '⏳', t: 'PENDIENTE' },
  run:     { g: '◌',  t: 'ANALIZANDO…' },
  ok:      { g: '✅', t: 'OK' },
  warn:    { g: '⚠️', t: 'LIMITADO' },
  fail:    { g: '❌', t: 'ERROR' }
};

/* ============================================================
   TOASTS (nunca errores técnicos al usuario)
   ============================================================ */
function toast(msg, kind) {
  try {
    const box = $('#toasts'); if (!box) return;
    const t = mk('div', 'toast' + (kind ? ' ' + kind : ''), esc(msg));
    box.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 3400);
  } catch (e) { swallow(e); }
}

/* ============================================================
   PERMISSIONS
   ============================================================ */
async function permState(name) {
  try {
    if (!navigator.permissions || !navigator.permissions.query) return 'unknown';
    const s = await navigator.permissions.query({ name: name });
    return s.state || 'unknown';
  } catch (e) { return 'unknown'; }
}
async function refreshPerm(name) {
  const s = await permState(name);
  STATE.perms[name] = s;
  updateScore();
  return s;
}

/* ============================================================
   SCORE ENGINE · DEVICE HEALTH SCORE
   ============================================================ */
function testCtx(kind) {
  try { const c = document.createElement('canvas'); return !!(c.getContext && c.getContext(kind)); }
  catch (e) { return false; }
}
const CAPS = [
  ['Geolocalización',            'api',    () => 'geolocation' in navigator],
  ['Vibración',                  'api',    () => 'vibrate' in navigator],
  ['Battery Status',             'api',    () => 'getBattery' in navigator],
  ['Network Information',        'api',    () => !!(navigator.connection || navigator.mozConnection || navigator.webkitConnection)],
  ['WebGL',                      'api',    () => testCtx('webgl'), 2],
  ['WebGL 2',                    'api',    () => testCtx('webgl2')],
  ['WebGPU',                     'api',    () => 'gpu' in navigator],
  ['WebAssembly',                'api',    () => 'WebAssembly' in window, 2],
  ['WebRTC',                     'api',    () => typeof RTCPeerConnection !== 'undefined'],
  ['Fullscreen API',             'api',    () => 'fullscreenEnabled' in document],
  ['Pointer Events',             'api',    () => 'PointerEvent' in window],
  ['Permissions API',            'api',    () => !!(navigator.permissions && navigator.permissions.query)],
  ['Service Workers',            'api',    () => 'serviceWorker' in navigator],
  ['Notificaciones',             'api',    () => 'Notification' in window],
  ['Storage (cuotas)',           'api',    () => !!(navigator.storage && navigator.storage.estimate)],
  ['getUserMedia',               'media',  () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), 2],
  ['Enumeración dispositivos',   'media',  () => !!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)],
  ['Web Audio',                  'media',  () => !!(window.AudioContext || window.webkitAudioContext)],
  ['Orientación (giroscopio)',   'sensor', () => 'DeviceOrientationEvent' in window],
  ['Movimiento (acelerómetro)',  'sensor', () => 'DeviceMotionEvent' in window],
  ['AmbientLightSensor',         'sensor', () => 'AmbientLightSensor' in window],
  ['Accelerometer (Gen.Sensor)', 'sensor', () => 'Accelerometer' in window],
  ['Gyroscope (Gen.Sensor)',     'sensor', () => 'Gyroscope' in window],
  ['Magnetometer',               'sensor', () => 'Magnetometer' in window],
  ['AbsoluteOrientationSensor',  'sensor', () => 'AbsoluteOrientationSensor' in window],
  ['RelativeOrientationSensor',  'sensor', () => 'RelativeOrientationSensor' in window],
  ['ProximitySensor',            'sensor', () => 'ProximitySensor' in window],
  ['Entrada táctil',             'compat', () => (navigator.maxTouchPoints || 0) > 0],
  ['Contexto seguro',            'compat', () => !!window.isSecureContext],
  ['RAM ≥ 4 GB',                 'compat', () => (navigator.deviceMemory || 0) >= 4],
  ['CPU ≥ 4 hilos',              'compat', () => (navigator.hardwareConcurrency || 0) >= 4],
  ['Pantalla HiDPI',             'compat', () => (window.devicePixelRatio || 1) > 1]
];
function capOk(c) { try { return !!c[2](); } catch (e) { return false; } }
function catPct(cat) {
  let ok = 0, tot = 0;
  CAPS.forEach(c => { if (c[1] === cat) { tot++; if (capOk(c)) ok++; } });
  return tot ? Math.round(ok / tot * 100) : null;
}
function computeCaps() {
  let ok = 0, tot = 0;
  CAPS.forEach(c => { const w = c[3] || 1; tot += w; if (capOk(c)) ok += w; });
  return Math.round(ok / tot * 100);
}
function scoreLabel(v) {
  if (v >= 85) return { l: 'EXCELENTE', c: 'exc', cls: 'grn' };
  if (v >= 70) return { l: 'MUY BUENO',  c: 'mb',  cls: '' };
  if (v >= 55) return { l: 'BUENO',      c: 'bueno', cls: '' };
  if (v >= 40) return { l: 'REGULAR',    c: 'reg', cls: 'amb' };
  return { l: 'LIMITADO', c: 'lim', cls: 'red' };
}
function updateScore() {
  try {
    const caps = computeCaps();
    let tOk = 0, tN = 0;
    STATE.results.forEach((r, id) => {
      if (id === 'bench' || id === 'reporte') return;
      if (r.status === 'ok') { tOk += 1; tN += 1; }
      else if (r.status === 'warn') { tOk += 0.6; tN += 1; }
      else if (r.status === 'fail') { tN += 1; }
    });
    const tests = tN ? Math.round(tOk / tN * 100) : null;
    let g = 0, q = 0;
    ['geolocation', 'camera', 'microphone'].forEach(k => {
      const v = STATE.perms[k];
      if (v && v !== 'unknown') { q++; if (v === 'granted') g++; }
    });
    const perms = q ? Math.round(g / q * 100) : null;
    const defs = [[caps, 60], [tests, 25], [perms, 15]].filter(d => d[0] != null);
    const tw = defs.reduce((a, d) => a + d[1], 0) || 1;
    const total = Math.round(defs.reduce((a, d) => a + d[0] * d[1], 0) / tw);
    const L = scoreLabel(total);
    STATE.lastScore = { total: total, label: L.l };
    const sv = $('#scv'), sl = $('#scl'), sb = $('#scbar');
    if (sv) sv.textContent = total;
    if (sl) { sl.textContent = L.l; sl.className = 'sc-lbl ' + L.c; }
    if (sb) { sb.style.width = total + '%'; sb.className = L.cls; }
    setChip('apis',    catPct('api'));
    setChip('sensors', catPct('sensor'));
    setChip('media',   catPct('media'));
    setChip('compat',  catPct('compat'));
    setChip('perms',   perms);
    setChip('tests',   tests);
  } catch (e) { swallow(e); }
}
const CHIPS = [
  { id: 'apis', label: 'APIS' }, { id: 'sensors', label: 'SENSORES' },
  { id: 'media', label: 'MULTIMEDIA' }, { id: 'compat', label: 'COMPATIB.' },
  { id: 'perms', label: 'PERMISOS' }, { id: 'tests', label: 'PRUEBAS' }
];
function buildChips() {
  const box = $('#chips'); if (!box) return;
  box.innerHTML = CHIPS.map(c =>

/* ---------- 01 · INFORMACIÓN GENERAL ---------- */
function localTZOffset() {
  const m = -new Date().getTimezoneOffset();
  const s = m < 0 ? '-' : '+';
  return s + String(Math.abs(Math.floor(m / 60))).padStart(2, '0') + ':' + String(Math.abs(m % 60)).padStart(2, '0');
}
function parseUA() {
  const ua = navigator.userAgent || '';
  let os = 'Desconocido', osv = '';
  if (/Windows NT ([\d.]+)/.test(ua)) { os = 'Windows'; osv = ({ '10.0': '10/11', '6.3': '8.1', '6.2': '8', '6.1': '7' })[RegExp.$1] || RegExp.$1; }
  else if (/Android ([\d.]+)/.test(ua)) { os = 'Android'; osv = RegExp.$1; }
  else if (/(iPhone|iPad|iPod)/.test(ua)) { const m = ua.match(/OS (\d+[_\d]*)/); os = 'iOS'; osv = m ? m[1].replace(/_/g, '.') : ''; }
  else if (/Mac OS X ([\d_]+)/.test(ua)) { os = 'macOS'; osv = RegExp.$1.replace(/_/g, '.'); }
  else if (/CrOS/.test(ua)) { os = 'ChromeOS'; }
  else if (/Linux/.test(ua)) { os = 'Linux'; }
  let br = 'Desconocido', ver = '', eng = '—';
  const t = re => { const m = ua.match(re); return m ? m[1] : ''; };
  if (/Edg\//.test(ua)) { br = 'Microsoft Edge'; ver = t(/Edg\/([\d.]+)/); eng = 'Blink'; }
  else if (/OPR\//.test(ua) || /Opera/.test(ua)) { br = 'Opera'; ver = t(/OPR\/([\d.]+)/) || t(/Version\/([\d.]+)/); eng = 'Blink'; }
  else if (/Firefox\//.test(ua)) { br = 'Firefox'; ver = t(/Firefox\/([\d.]+)/); eng = 'Gecko'; }
  else if (/Chrome\//.test(ua)) { br = 'Chrome'; ver = t(/Chrome\/([\d.]+)/); eng = 'Blink'; }
  else if (/Safari\//.test(ua)) { br = 'Safari'; ver = t(/Version\/([\d.]+)/); eng = 'WebKit'; }
  return { os: os, osv: osv, br: br, ver: ver, eng: eng, ua: ua };
}
async function dGeneral() {
  const p = parseUA();
  let uad = null;
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      uad = await navigator.userAgentData.getHighEntropyValues(['architecture', 'bitness', 'platformVersion', 'model']);
    }
  } catch (e) { uad = null; }
  let tz = '—';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
  const d = {
    so: p.os + (p.osv ? ' ' + p.osv : ''),
    navegador: p.br + (p.ver ? ' ' + p.ver : ''),
    motor: p.eng,
    ua: p.ua,
    plataforma: navigator.platform || '—',
    idiomas: (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '—']).join(', '),
    zona: (tz || '—') + ' (UTC' + localTZOffset() + ')',
    cores: navigator.hardwareConcurrency ? navigator.hardwareConcurrency + ' hilos' : 'no expuesta',
    ram: navigator.deviceMemory ? '≈ ' + navigator.deviceMemory + ' GB' : 'no expuesta',
    cookies: navigator.cookieEnabled ? 'Habilitadas' : 'Bloqueadas',
    dnt: navigator.doNotTrack === '1' ? 'Activado' : (navigator.doNotTrack === '0' ? 'Desactivado' : 'Sin señal'),
    online: navigator.onLine ? 'Conectado' : 'Desconectado',
    dpr: (window.devicePixelRatio || 1).toFixed(2),
    res: screen.width + ' × ' + screen.height + ' px',
    view: window.innerWidth + ' × ' + window.innerHeight + ' px',
    orient: (screen.orientation && screen.orientation.type) ? screen.orientation.type : (innerWidth > innerHeight ? 'horizontal' : 'vertical'),
    color: (screen.colorDepth || 0) + ' bits',
    touch: navigator.maxTouchPoints || 0,
    seguro: window.isSecureContext ? 'Sí (HTTPS/localhost)' : 'No'
  };
  STATE.general = d;
  setResult('general', 'ok', 'Dispositivo identificado: ' + d.so + ' · ' + d.navegador + '.', [
    ['User Agent', p.ua],
    ['Plataforma', d.plataforma],
    ['UA-CH / datos', uad ? ((uad.architecture || '—') + (uad.bitness ? ' ' + uad.bitness + '-bit' : '') + (uad.platformVersion ? ' · pv ' + uad.platformVersion : '') + (uad.model ? ' · ' + uad.model : '')) : 'no disponible'],
    ['Arquitectura detectable', uad && uad.architecture ? uad.architecture + (uad.bitness ? ' ' + uad.bitness + '-bit' : '') : 'no expuesta'],
    ['Sistema operativo', d.so],
    ['Navegador', d.navegador],
    ['Motor de renderizado', d.motor],
    ['Idiomas', d.idiomas],
    ['Zona horaria', d.zona],
    ['CPU (núcleos/hilos)', d.cores],
    ['Device Memory', d.ram],
    ['Cookies', d.cookies],
    ['Do Not Track', d.dnt],
    ['Online / Offline', d.online],
    ['DPR (densidad)', d.dpr],
    ['Resolución física', d.res],
    ['Ventana visible', d.view],
    ['Orientación', d.orient],
    ['Profundidad de color', d.color],
    ['Puntos táctiles', String(d.touch)],
    ['Contexto seguro', d.seguro]

}

/* ---------- 03 · ENTRADA TÁCTIL ---------- */
async function dTouch() {
  const tp = navigator.maxTouchPoints || 0;
  const coarse = window.matchMedia ? matchMedia('(pointer:coarse)').matches : false;
  const fine = window.matchMedia ? matchMedia('(pointer:fine)').matches : false;
  setResult('touch', tp > 0 ? 'ok' : 'warn',
    tp > 0
      ? 'Entrada táctil disponible (hasta ' + tp + ' puntos simultáneos). Toque el área para probar.'
      : '⚠️ No soportado por este dispositivo — sin digitalizador táctil. Use el área con ratón/puntero.',
    [
      ['maxTouchPoints', String(tp)],
      ['Pointer Events', 'PointerEvent' in window ? 'Disponibles' : 'No disponibles'],
      ['ontouchstart', ('ontouchstart' in window) ? 'Presente' : 'Ausente'],
      ['Puntero grueso (dedo)', coarse ? 'Sí' : 'No'],
      ['Puntero fino (ratón)', fine ? 'Sí' : 'No']
    ], { tp: tp });
}
function wireTouch(card) {
  const pad = card.querySelector('[data-tpad]');
  const live = card.querySelector('[data-tlive]');
  const dots = new Map(); let peak = 0, seq = 0;
  const cols = ['#00e5ff', '#ff2bd6', '#00ff9d', '#ffb547', '#7c4dff', '#ff3355'];
  const rect = () => pad.getBoundingClientRect();
  const setMsg = () => { live.textContent = 'ACTIVOS ' + dots.size + ' · PICO SIMULTÁNEO ' + peak; };
  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    const d = mk('div', 'dot');
    d.style.color = cols[seq % cols.length];
    d.style.borderColor = cols[seq % cols.length];
    seq++;
    const r = rect();
    d.style.left = (e.clientX - r.left) + 'px';
    d.style.top = (e.clientY - r.top) + 'px';
    pad.appendChild(d);
    dots.set(e.pointerId, d);
    if (dots.size > peak) peak = dots.size;
    setMsg();
    if (peak >= 2) setResult('touch', 'ok', 'Multitáctil verificado: pico de ' + peak + ' toques simultáneos.');
  });
  pad.addEventListener('pointermove', e => {
    const d = dots.get(e.pointerId); if (!d) return;
    const r = rect();
    d.style.left = (e.clientX - r.left) + 'px';
    d.style.top = (e.clientY - r.top) + 'px';
  });
  const drop = e => { const d = dots.get(e.pointerId); if (d) { d.remove(); dots.delete(e.pointerId); setMsg(); } };
  pad.addEventListener('pointerup', drop);
  pad.addEventListener('pointercancel', drop);
}

function wireInput(card) {
  const pad = card.querySelector('[data-kpad]');
  const log = card.querySelector('[data-klog]');
  const live = card.querySelector('[data-klive]');
  const n = { key: 0, ptr: 0, whl: 0 };
  const push = (t, cls) => {
    const li = mk('li', cls || '', t);
    log.insertBefore(li, log.firstChild);
    while (log.children.length > 7) log.removeChild(log.lastChild);
  };
  const upd = () => { live.textContent = 'KEYS ' + n.key + ' · CLICKS/POINTER ' + n.ptr + ' · WHEEL ' + n.whl; };
  pad.addEventListener('keydown', e => { n.key++; push('KEYDOWN → <b>' + esc(e.key) + '</b> (code ' + esc(e.code || '—') + ')'); upd(); });
  pad.addEventListener('pointerdown', e => { n.ptr++; push('POINTERDOWN → x:' + Math.round(e.offsetX) + ' y:' + Math.round(e.offsetY) + ' · botón ' + e.button, 'mg'); upd(); });
  pad.addEventListener('dblclick', () => { n.ptr++; push('DBLCLICK detectado', 'mg'); upd(); });
  pad.addEventListener('wheel', e => { e.preventDefault(); n.whl++; push('WHEEL → deltaY:' + Math.round(e.deltaY), 'gr'); upd(); }, { passive: false });
  pad.addEventListener('contextmenu', e => { e.preventDefault(); push('CONTEXTMENU (botón derecho)', 'mg'); });
}

function drawVU(g, cv, data) {
  const W = cv.width = cv.clientWidth * (window.devicePixelRatio || 1) || cv.width;

  const bars = 36, step = Math.floor(data.length / bars);
  const bw = W / bars;
  for (let i = 0; i < bars; i++) {
    let v = 0; for (let j = 0; j < step; j++) v = Math.max(v, data[i * step + j]);
    const h = Math.max(3, (v / 255) * (H - 10));
    g.fillStyle = v > 200 ? '#ff2bd6' : (v > 120 ? '#00ff9d' : '#00e5ff');
    g.shadowBlur = 8; g.shadowColor = g.fillStyle;
    g.fillRect(i * bw + 2, H - h - 4, bw - 4, h);
  }
  g.shadowBlur = 0;
}

/* ---------- 22 · TORCH (linterna) ---------- */
async function torchTest() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setResult('torch', 'warn', '⚠️ No disponible en este navegador.'); return; }
  markRun('torch', 'Activando cámara trasera para sondear flash…');
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    const track = stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : null;
    if (!caps || !('torch' in caps)) {
      setResult('torch', 'warn', '⚠️ No disponible en este navegador o el dispositivo no expone control de flash vía web.', [['getCapabilities().torch', 'ausente']]);
    } else {
      try {
        await track.applyConstraints({ advanced: [{ torch: true }] });
        setResult('torch', 'ok', 'Linterna ENCENDIDA — ciclo de prueba de 1.5 s en curso…');
        await sleep(1500);
        await track.applyConstraints({ advanced: [{ torch: false }] });
        setResult('torch', 'ok', 'Linterna operativa — encendido y apagado verificados.', [['getCapabilities().torch', 'true'], ['Ciclo', '1.5 s completado']]);
      } catch (e) { setResult('torch', 'warn', '⚠️ Flash detectado pero el encendido fue rechazado por el sistema.'); }
    }
  } catch (e) { camErr(e); }
  finally { if (stream) try { stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
}

function benchLock(card) {

function setBench(key, val, unit, max, label) {

async function benchCPU(card, btn) {
  benchLock(card);
  try {
    await sleep(50);
    const N = 2500000; let acc = 0;
    const t0 = performance.now();
    for (let i = 1; i <= N; i++) { acc += Math.sqrt((i % 1000) + 1) * Math.sin(i * 0.001) * Math.cos(i % 7); }
    const ms = Math.max(performance.now() - t0, 0.01);
    const mops = +(N / ms / 1000).toFixed(1);
    if (acc === -12345.6789) console.log('');
    setBench('cpu', mops, 'MOps/s', 60, 'Benchmark CPU');
    toast('Benchmark CPU completado.', 'ok');
  } catch (e) { toast('Benchmark no disponible.', 'warn'); }
  benchUnlock(card);
}
async function benchRender(card) {
  benchLock(card);
  try {
    const cv = $('#brcv'); const g = cv.getContext('2d');
    const W = cv.width = (cv.clientWidth || 600) * (window.devicePixelRatio || 1);
    const H = cv.height = 160 * (window.devicePixelRatio || 1);
    let objs = 0;
    const t0 = performance.now();
    while (performance.now() - t0 < 1000) {
      for (let i = 0; i < 150; i++) {
        g.fillStyle = 'hsl(' + ((objs * 7) % 360) + ' 85% 55%)';
        g.fillRect(Math.random() * W, Math.random() * H, 16, 16);
        objs++;
      }
    }
    const dur = (performance.now() - t0) / 1000;
    const kps = Math.round(objs / dur / 1000);
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#00e5ff'; g.font = Math.round(22 * (window.devicePixelRatio || 1)) + 'px monospace';
    g.fillText(kps + 'K objetos/s dibujados', 16, H / 2);
    setBench('render', kps, 'K obj/s', 900, 'Benchmark Render');
    toast('Benchmark de renderizado completado.', 'ok');
  } catch (e) { toast('Benchmark no disponible.', 'warn'); }
  benchUnlock(card);
}
async function benchMem(card) {
  benchLock(card);
  try {
    await sleep(30);
    const CH = 8 * 1024 * 1024; let mb = 0;
    const t0 = performance.now();
    try {
      for (let c = 0; c < 16; c++) {
        const a = new Float64Array(CH);
        for (let i = 0; i < CH; i += 8) a[i] = Math.sin(i) * Math.random();
        mb += 8;
      }
    } catch (e) { toast('Memoria insuficiente: benchmark parcial.', 'warn'); }
    const mbs = Math.round((mb * 1024) / Math.max((performance.now() - t0) / 1000, 0.001));
    setBench('mem', mbs, 'MB/s', 9000, 'Benchmark Memoria');
    toast('Benchmark de memoria completado.', 'ok');
  } catch (e) { toast('Benchmark no disponible.', 'warn'); }
  benchUnlock(card);
}
async function benchAnim(card) {
  benchLock(card);
  try {
    let frames = 0, mn = Infinity, wF = 0, wT = performance.now();
    const t0 = wT;
    await new Promise(res => {
      const step = () => {
        frames++; wF++;
        const now = performance.now();
        if (now - wT >= 500) {
          const f = wF * 1000 / (now - wT);
          if (f < mn) mn = f;
          wF = 0; wT = now;
          const lv = $('#banflive'); if (lv) lv.textContent = Math.round(f) + ' FPS…';
        }
        if (now - t0 < 3000) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
    const avg = Math.round(frames / 3);
    if (!isFinite(mn)) mn = avg;
    const lv = $('#banflive'); if (lv) lv.textContent = avg + ' FPS promedio · mín ' + Math.round(mn) + ' FPS';
    setBench('anim', avg, 'FPS', 120, 'Benchmark Animación');
    toast('Benchmark de animación completado.', 'ok');
  } catch (e) { toast('Benchmark no disponible.', 'warn'); }
  benchUnlock(card);
}

  { id: 'webrtc', title: 'WebRTC', quick: true, msg0: '⏳ Verificando WebRTC…', passive: dWebRTC, wire: null },
  { id: 'wasm', title: 'WebAssembly', quick: true, msg0: '⏳ Verificando WebAssembly…', passive: dWasm, wire: null },
  { id: 'webgl', title: 'WebGL', quick: true, msg0: '⏳ Sondeando GPU…', passive: dWebGL, wire: null },
  { id: 'webgpu', title: 'WebGPU', msg0: '⏳ Verificando WebGPU…', passive: dWebGPU, wire: null },

      setResult('torch', 'pending', '⏳ Pulse DETECTAR TORCH: se activará la cámara trasera para sondear el flash.', [['Método', 'getCapabilities().torch + applyConstraints']]);
    },
    wire: card => { addBtn(card, 'Detectar Torch', 'mag', torchTest); }

    id: 'pwa', title: 'PWA', quick: true, msg0: '⏳ Analizando capacidades PWA…', passive: dPWA,
    wire: card => {

    live:
      '<div class="bench-row"><div><h4>Benchmark CPU</h4><p>2.5M operaciones matemáticas · mide MOps/s</p></div><div class="bench-val" data-bv="cpu">—</div><div class="bench-bar bar"><i data-bb="cpu"></i></div></div>' +
      '<div class="bench-row"><div><h4>Benchmark Renderizado</h4><p>1 segundo de dibujo canvas intensivo · mide K objetos/s</p></div><div class="bench-val" data-bv="render">—</div><div class="bench-bar bar"><i data-bb="render"></i></div></div>' +
      '<div class="bench-row"><div><h4>Benchmark Memoria</h4><p>128 MB escritos en typed arrays · mide MB/s</p></div><div class="bench-val" data-bv="mem">—</div><div class="bench-bar bar"><i data-bb="mem"></i></div></div>' +
      '<div class="bench-row"><div><h4>Benchmark Animación</h4><p>3 segundos de requestAnimationFrame · mide FPS</p><div class="live-note" id="banflive">Pulse EJECUTAR para medir</div></div><div class="bench-val" data-bv="anim">—</div><div class="bench-bar bar"><i data-bb="anim"></i></div></div>',
    wire: card => {

      addBtn(card, 'Ejecutar Render', '', () => benchRender(card));
      addBtn(card, 'Ejecutar Memoria', '', () => benchMem(card));

    id: 'reporte', title: 'Reporte y Exportación', wide: true, msg0: '⏳ Genere el certificado NEXUS DEVICE LAB REPORT cuando lo desee.', passive: null,

      addBtn(card, 'Generar Informe', 'grn', openReport);

];
const AUTO_FULL = ['gps', 'vibrate', 'speaker', 'gyro', 'accel'];
function byId(id) { return SECTIONS.find(s => s.id === id); }

/* ============================================================
   MODOS DE ANÁLISIS
   ============================================================ */
function setModeButtons(m) {
  ['quick', 'full', 'manual'].forEach(k => {
    const b = $('#m-' + k); if (b) b.classList.toggle('on', k === m);
  });
}
function stopAll() {
  stopCam(); stopMic(); stopGeo(); stopGyro(); stopAccel();
}
async function runMode(m) {
  STATE.mode = m;
  setModeButtons(m);
  if (m === 'manual') { toast('Modo MANUAL: decida usted qué componente analizar.'); return; }
  stopAll();
  const list = (m === 'quick') ? SECTIONS.filter(s => s.quick) : SECTIONS.slice();
  SECTIONS.forEach(s => {
    const inList = list.indexOf(s) !== -1;
    if (m === 'quick' && !inList) resetSection(s.id, '⏳ Fuera del alcance del modo rápido — use COMPLETO o MANUAL.');
    else if (inList) resetSection(s.id);
  });
  for (const s of list) {
    if (!s.passive) { setResult(s.id, 'pending', s.msg0 || '⏳ Ejecución manual requerida.'); continue; }
    markRun(s.id);
    try { await s.passive(); } catch (e) { setResult(s.id, 'warn', '⚠️ No disponible en este navegador.'); }
    await sleep(m === 'quick' ? 60 : 40);
  }
  if (m === 'full') {
    toast('Diagnóstico COMPLETO: pruebas pasivas + interactivas básicas ejecutadas.', 'ok');
    for (const id of AUTO_FULL) {
      const s = byId(id);
      if (s) {
        markRun(id, 'Prueba interactiva en curso…');
        try {
          if (id === 'gps') await startGeo();
          else if (id === 'vibrate') doVib();
          else if (id === 'speaker') beep();
          else if (id === 'gyro') await startGyro();
          else if (id === 'accel') await startAccel();
        } catch (e) {}
        await sleep(180);
      }
    }
  } else {
    toast('Diagnóstico RÁPIDO completado — pruebas esenciales ejecutadas.', 'ok');
  }
}

/* ============================================================
   PWA · MANIFEST EN LINEA + INSTALACIÓN
   ============================================================ */
function setupManifest() {
  try {
    const man = {
      name: 'NEXUS DEVICE LAB', short_name: 'NEXUS',
      description: 'Universal Browser Diagnostics Platform',
      start_url: '.', display: 'standalone',
      background_color: '#030508', theme_color: '#030508',
      icons: [{ src: 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23030508%27/%3E%3Cpath d=%27M8 24V8h3l10 12V8h3v16h-3L11 12v12z%27 fill=%27%2300e5ff%27/%3E%3C/svg%3E', sizes: 'any', type: 'image/svg+xml' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
  } catch (e) {}
}

/* ============================================================
   RELOJ / LEDS GLOBALES
   ============================================================ */
function startClock() {
  const c = $('#clock');
  const tick = () => { try { c.textContent = new Date().toLocaleTimeString('es-AR', { hour12: false }); } catch (e) {} };
  tick(); setInterval(tick, 1000);
}

/* ============================================================
   INIT
   ============================================================ */
function buildUI() {
  buildChips();
  SECTIONS.forEach((s, i) => {
    const card = buildCard(s, i);
    if (s.wire) { try { s.wire(card); } catch (e) { swallow(e); } }
  });
}
function bindGlobal() {
  $$('#ctl [data-mode]').forEach(b => b.addEventListener('click', guard(() => runMode(b.getAttribute('data-mode')))));
  $('#techbtn').addEventListener('click', guard(() => {
    STATE.tech = !STATE.tech;
    document.body.classList.toggle('tech-on', STATE.tech);
    $('#techbtn').textContent = STATE.tech ? 'Modo Usuario' : 'Ver Detalles Técnicos';
    $('#techbtn').classList.toggle('on', STATE.tech);
  }));
  $('#resetbtn').addEventListener('click', guard(() => {
    stopAll();
    STATE.results.clear();
    runMode(STATE.mode || 'quick');
    toast('Sistema reiniciado.', 'ok');
  }));
  $('#colortest').addEventListener('click', guard(exitColorTest));
  $('#closemodal').addEventListener('click', guard(() => $('#modal').classList.remove('on')));
  $('#printbtn').addEventListener('click', guard(() => { try { window.print(); } catch (e) {} }));
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) $('#modal').classList.remove('on'); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#modal').classList.contains('on')) $('#modal').classList.remove('on');
      else if ($('#colortest').classList.contains('on')) exitColorTest();
    }
  });
  try {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); STATE.pip = e;
      const b = $('#pwa-install'); if (b) b.style.display = '';
      const r = STATE.results.get('pwa'); if (r) dPWA();
    });
    window.addEventListener('appinstalled', () => { setResult('pwa', 'ok', 'Aplicación instalada correctamente.'); });
  } catch (e) {}
  window.addEventListener('unhandledrejection', e => { try { e.preventDefault(); } catch (err) {} });
  window.addEventListener('error', e => { if (e && e.cancelable) { try { e.preventDefault(); } catch (err) {} } });
}
function init() {
  try { buildUI(); } catch (e) { swallow(e); }
  try { bindGlobal(); } catch (e) { swallow(e); }
  try { startClock(); } catch (e) { swallow(e); }
  try { setupManifest(); } catch (e) { swallow(e); }
  const s = $('#secled');
  if (s) { s.className = 'lednet' + (window.isSecureContext ? '' : ' uns'); s.style.background = window.isSecureContext ? 'var(--green)' : 'var(--amber)'; }
  upNetLED();
  updateScore();
  runMode('quick');
  STATE.started = true;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
